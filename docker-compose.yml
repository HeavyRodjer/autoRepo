version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: fleet_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "80:3000"
    environment:
      DATABASE_URL: postgresql://admin:supersecretpassword@db:5432/fleet_db?schema=public
    depends_on:
      - db

volumes:
  pgdata:
