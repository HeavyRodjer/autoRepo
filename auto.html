<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управління орендою авто</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800 p-8 font-sans">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">Система управління автопарком</h1>

        <div class="bg-blue-50 p-4 rounded mb-6 text-center">
            <h2 class="text-lg font-semibold text-gray-700">Загальний баланс автопарку</h2>
            <p id="total-balance" class="text-3xl font-bold text-green-600">0 ₴</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="border p-4 rounded bg-white">
                <h3 class="font-semibold mb-3 text-lg">Додати автомобіль</h3>
                <input type="text" id="car-name" placeholder="Назва (напр. Ford Fiesta 2016)"
                    class="w-full border p-2 rounded mb-2 focus:outline-blue-500">
                <button onclick="addCar()"
                    class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 transition">Додати в
                    гараж</button>
            </div>

            <div class="border p-4 rounded bg-white">
                <h3 class="font-semibold mb-3 text-lg">Операція по конкретному авто</h3>

                <label class="block text-sm text-gray-600 mb-1">Виберіть автомобіль:</label>
                <select id="finance-car-select" class="w-full border p-2 rounded mb-2 focus:outline-blue-500">
                </select>

                <label class="block text-sm text-gray-600 mb-1">Тип операції:</label>
                <select id="finance-type" class="w-full border p-2 rounded mb-2 focus:outline-blue-500">
                    <option value="income">Прибуток (Оренда)</option>
                    <option value="expense">Витрата (СТО, ремонт, деталі)</option>
                </select>

                <input type="number" id="finance-amount" placeholder="Сума (₴)"
                    class="w-full border p-2 rounded mb-2 focus:outline-blue-500">
                <button onclick="addTransaction()"
                    class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600 transition">Записати
                    витрату/прибуток</button>
            </div>
        </div>

        <div class="mt-8">
            <h3 class="text-xl font-bold mb-4">Мій автопарк та аналітика</h3>
            <div id="car-list" class="space-y-4"></div>
        </div>
    </div>

    <script>
        // Структура авто тепер має унікальний ID та масив транзакцій
        let cars = JSON.parse(localStorage.getItem('fleetCarsWithFinances')) || [];

        function updateUI() {
            const list = document.getElementById('car-list');
            const carSelect = document.getElementById('finance-car-select');

            list.innerHTML = '';
            carSelect.innerHTML = '';

            let totalFleetBalance = 0;

            if (cars.length === 0) {
                list.innerHTML = '<p class="text-gray-500 italic text-center py-4">Гараж порожній. Додайте перше авто.</p>';
                carSelect.innerHTML = '<option value="">Нічого вибирати</option>';
                document.getElementById('total-balance').innerText = '0 ₴';
                document.getElementById('total-balance').className = 'text-3xl font-bold text-gray-500';
                return;
            }

            cars.forEach((car) => {
                // Рахуємо баланс конкретного авто
                let carBalance = 0;
                car.transactions.forEach(t => {
                    if (t.type === 'income') carBalance += t.amount;
                    else carBalance -= t.amount;
                });

                totalFleetBalance += carBalance;

                // Додаємо авто в дропдаун фінансових операцій
                const option = document.createElement('option');
                option.value = car.id;
                option.innerText = car.name;
                carSelect.appendChild(option);

                // Рендеримо картку автомобіля
                const carCard = document.createElement('div');
                carCard.className = 'border p-4 rounded-lg bg-gray-50 shadow-sm flex flex-col md:flex-row md:justify-between md:items-center gap-4';

                carCard.innerHTML = `
                    <div>
                        <h4 class="text-lg font-bold text-gray-900" data-testid="car-title">${car.name}</h4>
                        <div class="flex items-center gap-3 mt-1">
                            <span class="px-2 py-0.5 rounded text-xs font-semibold ${car.rented ? 'bg-orange-200 text-orange-800' : 'bg-green-200 text-green-800'}">
                                ${car.rented ? 'В оренді' : 'Вільно'}
                            </span>
                            <span class="text-sm font-medium ${carBalance >= 0 ? 'text-green-600' : 'text-red-600'}">
                                Баланс авто: ${carBalance} ₴
                            </span>
                        </div>
                        <div class="text-xs text-gray-500 mt-2">
                            Операцій записано: ${car.transactions.length}
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2 self-end md:self-center">
                        <button onclick="toggleStatus('${car.id}')" class="text-sm bg-blue-100 text-blue-700 px-3 py-1.5 rounded hover:bg-blue-200 transition">
                            ${car.rented ? 'Повернути з оренди' : 'Здати в оренду'}
                        </button>
                        <button onclick="deleteCar('${car.id}')" class="text-sm bg-red-100 text-red-600 px-3 py-1.5 rounded hover:bg-red-200 transition">
                            Видалити
                        </button>
                    </div>
                `;
                list.appendChild(carCard);
            });

            // Оновлюємо загальний баланс вгорі
            document.getElementById('total-balance').innerText = `${totalFleetBalance} ₴`;
            document.getElementById('total-balance').className = `text-3xl font-bold ${totalFleetBalance >= 0 ? 'text-green-600' : 'text-red-600'}`;

            localStorage.setItem('fleetCarsWithFinances', JSON.stringify(cars));
        }

        function addCar() {
            const input = document.getElementById('car-name');
            if (input.value.trim() === '') return;

            const newCar = {
                id: 'car_' + Date.now(),
                name: input.value.trim(),
                rented: false,
                transactions: [] // порожній масив під витрати і прибутки
            };

            cars.push(newCar);
            input.value = '';
            updateUI();
        }

        function toggleStatus(carId) {
            const car = cars.find(c => c.id === carId);
            if (car) {
                car.rented = !car.rented;
                updateUI();
            }
        }

        function deleteCar(carId) {
            cars = cars.filter(c => c.id !== carId);
            updateUI();
        }

        function addTransaction() {
            const carId = document.getElementById('finance-car-select').value;
            const type = document.getElementById('finance-type').value;
            const amount = parseInt(document.getElementById('finance-amount').value);

            if (!carId || isNaN(amount) || amount <= 0) return;

            const car = cars.find(c => c.id === carId);
            if (car) {
                car.transactions.push({
                    type: type,
                    amount: amount,
                    date: new Date().toLocaleDateString()
                });

                document.getElementById('finance-amount').value = '';
                updateUI();
            }
        }

        // Ініціалізація додатка
        updateUI();
    </script>
</body>

</html>
